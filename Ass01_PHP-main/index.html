<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h2>Job Application Form</h2>

        <form id="jobForm" action="index.php" method="POST" enctype="multipart/form-data"
            onsubmit="return validateForm()">

            <!-- Error display area -->
            <div id="error-messages" class="error-container" style="display: none;">
            </div>

            <div class="form-group">
                <label for="name" class="required">Full Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your full name">
                <span class="error" id="nameError"></span>
            </div>

            <label for="name" class="required">Email Address</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="name" class="required">Contact Number </label>
            <input type="tel" name="contact" id="contact" placeholder="Enter your phone number">
            <span class="error" id="contactError"></span>

            <label for="name" class="required">Date of Birth </label>
            <input type="date" name="dob" id="dob">
            <span class="error" id="dobError"></span>

            <label for="name" class="required">Position Applied For </label>
            <select name="position" id="position">
                <option value="">Select a position</option>
                <option value="Software Developer">Software Developer</option>
                <option value="Web Designer">Web Designer</option>
                <option value="Project Manager">Project Manager</option>
            </select>
            <span class="error" id="positionError"></span>

            <label for="name" class="required">Upload Resume (PDF/DOC only, max 2MB)</label>
            <input type="file" name="resume" id="resume" accept=".pdf,.doc,.docx">
            <span class="error" id="resumeError"></span>

            <label>Cover Letter</label>
            <textarea name="coverletter" id="coverletter" rows="4"
                placeholder="Write your cover letter here..."></textarea>

            <label>LinkedIn Profile</label>
            <input type="url" name="linkedin" id="linkedin" placeholder="https://www.linkedin.com/in/username">
            <span class="error" id="linkedinError"></span>

            <label for="name" class="required">Work Experience (Years)</label>
            <input type="number" name="experience" id="experience" min="0" max="50"
                placeholder="Enter years of experience">
            <span class="error" id="experienceError"></span>

            <label for="name" class="required">Skills (Select at least one) </label>
            <div class="skills" id="skillsContainer">
                <label><input type="checkbox" name="skills[]" value="HTML"> HTML</label>
                <label><input type="checkbox" name="skills[]" value="CSS"> CSS</label>
                <label><input type="checkbox" name="skills[]" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" name="skills[]" value="PHP"> PHP</label>
                <label><input type="checkbox" name="skills[]" value="Java"> Java</label>
            </div>
            <span class="error" id="skillsError"></span>

            <input type="submit" value="Apply" class="submit-btn">
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Reservation</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

<h2>Hotel Reservation</h2>

<form method="POST" action="index.php" onsubmit="return validateForm()">

    <label>Customer Name</label>
    <input type="text" name="customer" required>

    <label>Check-in Date</label>
    <input type="date" name="checkin" required>

    <label>Check-out Date</label>
    <input type="date" name="checkout" required>

    <label>Hotel</label>
    <select name="hotel" required>
        <option value="Riverside">Riverside Hotel</option>
        <option value="Lagoon">Lagoon View Hotel</option>
        <option value="Nature">Nature Villa</option>
        <option value="Beach">Beach Resort</option>
    </select>

    <label>Room Type</label>
    <input type="radio" name="room" value="Standard" required> Standard  
    <input type="radio" name="room" value="Deluxe"> Deluxe  
    <input type="radio" name="room" value="Executive"> Executive  

    <h3>Activities (Hours)</h3>

    <input type="checkbox" name="spa"> Spa
    <input type="number" name="spa_hours" min="0">

    <input type="checkbox" name="cycling"> Cycling
    <input type="number" name="cycling_hours" min="0">

    <input type="checkbox" name="swimming"> Swimming
    <input type="number" name="swimming_hours" min="0">

    <input type="checkbox" name="gym"> Gym
    <input type="number" name="gym_hours" min="0">

    <h3>Board Type</h3>
    <input type="radio" name="board" value="Half" required> Half Board  
    <input type="radio" name="board" value="Full"> Full Board  

    <button type="submit">Reserve</button>
</form>

</body>
</html>
